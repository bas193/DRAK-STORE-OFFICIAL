<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — DARK STORE PRO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../style.css">
</head>
<body class="login-page">
    <div class="login-card">
        <h2><i class="fa-solid fa-lock"></i> ADMIN LOGIN</h2>
        <form onsubmit="event.preventDefault(); login();">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Masukkan username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Masukkan password" required>
            </div>
            <button type="submit" class="btn btn-gold" style="width:100%;padding:14px;font-size:16px">LOGIN</button>
        </form>
        <p class="login-note">Default: dark / dark123</p>
        <a href="../index.html" style="display:block;text-align:center;color:#FFC107;margin-top:20px;font-size:14px">← Kembali ke Kedai</a>
    </div>
    <script src="../script.js"></script>
</body>
</html>
