<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — DARK STORE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../style.css">
</head>
<body class="admin-wrap">
    <div class="admin-login-box">
        <div class="admin-login-card">
            <h2><i class="fa-solid fa-gem"></i> DARK STORE</h2>
            <p style="color:var(--gray);margin-bottom:24px">Admin Panel — Login</p>
            
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Masukkan username">
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Masukkan password" onkeypress="if(event.key==='Enter')login()">
            </div>
            
            <button onclick="login()">🔐 MASUK</button>
            <a href="../index.html" class="back-link">← Kembali ke Kedai</a>
        </div>
    </div>

    <script src="../script.js"></script>
</body>
</html>
