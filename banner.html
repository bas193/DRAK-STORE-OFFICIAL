<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banner — DARK STORE PRO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../style.css">
</head>
<body class="admin-layout">
    <aside class="admin-sidebar">
        <div class="logo">💎 DARK STORE</div>
        <nav>
            <a href="dashboard.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
            <a href="produk.html"><i class="fa-solid fa-box"></i> Produk</a>
            <a href="tambah.html"><i class="fa-solid fa-plus"></i> Tambah Produk</a>
            <a href="kategori.html"><i class="fa-solid fa-folder"></i> Kategori</a>
            <a href="order.html"><i class="fa-solid fa-receipt"></i> Pesanan</a>
            <a href="banner.html" class="active"><i class="fa-solid fa-image"></i> Banner</a>
            <a href="setting.html"><i class="fa-solid fa-cog"></i> Tetapan</a>
            <a href="#" onclick="logout()"><i class="fa-solid fa-sign-out-alt"></i> Logout</a>
        </nav>
    </aside>

    <main class="admin-content">
        <div class="admin-header">
            <h1>🖼️ URUS BANNER</h1>
            <a href="dashboard.html" class="btn btn-gray"><i class="fa-solid fa-arrow-left"></i> Kembali</a>
        </div>

        <div class="form-card" style="margin-bottom:30px">
            <h3 style="margin-bottom:15px">➕ Tambah Banner Baru</h3>
            <div class="form-group">
                <label>Tajuk Banner (Pilihan)</label>
                <input type="text" id="bannerTajuk" placeholder="Contoh: Promosi Bulan Ini">
            </div>
            <div class="form-group">
                <label>Gambar Banner *</label>
                <input type="file" id="bannerGambar" accept="image/*">
            </div>
            <button class="btn btn-gold" onclick="tambahBanner()">📤 Upload Banner</button>
        </div>

        <h3 style="margin-bottom:15px">📋 Senarai Banner</h3>
        <div id="banner-list"></div>
    </main>
    <script src="../script.js"></script>
</body>
  </html>
