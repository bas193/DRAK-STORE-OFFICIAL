<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARK STORE — Top Up Game & Servis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="logo"><i class="fa-solid fa-gem"></i> DARK STORE</div>
        <a href="admin/login.html" class="admin-btn"><i class="fa-solid fa-lock"></i> Admin</a>
    </header>

    <section class="banner">
        <h1>💎 TOP UP GAME & SERVIS</h1>
        <p>Murah • Cepat • Amanah — Proses 1-5 Minit!</p>
    </section>

    <section class="container">
        <h2 class="section-title">🔥 KATALOG PRODUK</h2>
        
        <!-- FILTER KATEGORI -->
        <div class="filter-bar" id="filterBar">
            <button class="filter-btn active" data-kategori="all">Semua</button>
        </div>
        
        <div class="product-grid" id="productList"></div>
    </section>

    <!-- MODAL BORANG ORDER -->
    <div class="modal-overlay" id="orderModal" style="display:none">
        <div class="modal-content">
            <span class="modal-close" onclick="tutupModal()">&times;</span>
            <h3 id="modalTitle">🛒 Buat Pesanan</h3>
            <p id="modalProdukNama" style="color:var(--gold);font-weight:700;margin-bottom:20px"></p>
            
            <div id="borangDiamond" style="display:none">
                <div class="form-group">
                    <label>👤 Nama Anda</label>
                    <input type="text" id="buyerNama" placeholder="Masukkan nama anda">
                </div>
                <div class="form-group">
                    <label>🎮 Player ID + Server</label>
                    <input type="text" id="buyerId" placeholder="Contoh: 12345678(1234)">
                </div>
                <div class="form-group">
                    <label>📱 No. Telefon / WhatsApp</label>
                    <input type="text" id="buyerPhone" placeholder="Contoh: 0123456789">
                </div>
                <div class="form-group">
                    <label>💬 Alamat / Catatan</label>
                    <input type="text" id="buyerNote" placeholder="Online / Lain-lain">
                </div>
            </div>
            
            <div id="borangBoost" style="display:none">
                <div class="form-group">
                    <label>👤 Nama Anda</label>
                    <input type="text" id="buyerNama2" placeholder="Masukkan nama anda">
                </div>
                <div class="form-group">
                    <label>🔗 Link Channel / Group WhatsApp</label>
                    <input type="text" id="buyerLink" placeholder="Tampal link penuh di sini">
                </div>
                <div class="form-group">
                    <label>📱 No. Telefon / WhatsApp</label>
                    <input type="text" id="buyerPhone2" placeholder="Contoh: 0123456789">
                </div>
                <div class="form-group">
                    <label>💬 Catatan Tambahan</label>
                    <input type="text" id="buyerNote2" placeholder="Jumlah yang dikehendaki, dll">
                </div>
            </div>
            
            <button class="btn btn-gold" onclick="hantarPesanan()" style="width:100%;margin-top:10px">✅ Hantar Pesanan ke WhatsApp</button>
        </div>
    </div>

    <footer>
        <p>© 2026 DARK STORE. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
              </html>
