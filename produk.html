<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produk — DARK STORE PRO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../style.css">
</head>
<body class="admin-layout">
    <aside class="admin-sidebar">
        <div class="logo">💎 DARK STORE</div>
        <nav>
            <a href="dashboard.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
            <a href="produk.html" class="active"><i class="fa-solid fa-box"></i> Produk</a>
            <a href="tambah.html"><i class="fa-solid fa-plus"></i> Tambah Produk</a>
            <a href="kategori.html"><i class="fa-solid fa-folder"></i> Kategori</a>
            <a href="order.html"><i class="fa-solid fa-receipt"></i> Pesanan</a>
            <a href="banner.html"><i class="fa-solid fa-image"></i> Banner</a>
            <a href="setting.html"><i class="fa-solid fa-cog"></i> Tetapan</a>
            <a href="#" onclick="logout()"><i class="fa-solid fa-sign-out-alt"></i> Logout</a>
        </nav>
    </aside>

    <main class="admin-content">
        <div class="admin-header">
            <h1>📦 SENARAI PRODUK</h1>
            <div style="display:flex;gap:10px">
                <a href="tambah.html" class="btn btn-gold"><i class="fa-solid fa-plus"></i> Tambah Produk</a>
                <input type="text" placeholder="🔍 Cari produk..." style="max-width:200px" onkeyup="searchProduk()">
            </div>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Gambar</th>
                        <th>Nama Produk</th>
                        <th>Harga</th>
                        <th>Kategori</th>
                        <th>Tindakan</th>
                    </tr>
                </thead>
                <tbody id="admin-produk"></tbody>
            </table>
        </div>
    </main>
    <script src="../script.js"></script>
</body>
              </html>
